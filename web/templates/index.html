<!DOCTYPE html>
{# =============================================================================
   Tableau de bord — vue « Traffic »

   Choix de conception
   -------------------
   Une seule source pour la mise en forme des lignes : le <template> ci-dessous. Le
   JavaScript le recopie pour chaque paquet, au lieu de reconstruire du HTML dans le
   script. Corriger l'affichage d'une ligne se fait donc à un seul endroit — le défaut
   classique de ces tableaux est d'avoir deux mises en forme divergentes.

   Les libellés de section sont en anglais (Traffic, Protocols, Sessions) conformément à
   l'énoncé ; les explications sont en français, parce qu'elles s'adressent à quelqu'un
   qui découvre le sujet.

   Accessibilité : les zones qui se mettent à jour seules sont annoncées (`aria-live`),
   les couleurs ne portent jamais seules une information, et le tableau garde un en-tête
   associé à ses cellules.
   ============================================================================= #}
<html lang="fr" data-theme="sombre">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Intelligent Network Packet Analyzer — Traffic</title>
  <link rel="stylesheet" href="{{ url_for('static', path='/dashboard.css') }}">
</head>
<body>
<a class="lien-evitement" href="#paquets">Aller au tableau des paquets</a>

<header class="entete">
  <div class="entete__titre">
    <span class="entete__marque" aria-hidden="true">◈</span>
    <div>
      <h1>Intelligent Network Packet Analyzer</h1>
      <p class="entete__sous-titre">Traffic observé sur le réseau — vue en direct</p>
    </div>
  </div>
  <div class="entete__actions">
    <span class="etiquette" title="Environnement d'exécution">{{ environnement }}</span>
    <span class="etat-connexion" id="etat-connexion" data-etat="attente" role="status">
      <span class="etat-connexion__point" aria-hidden="true"></span>
      <span id="etat-connexion-texte">Connexion…</span>
    </span>
    <button type="button" class="bouton bouton--fantome" id="bascule-theme"
            aria-label="Changer de thème clair ou sombre">Thème</button>
  </div>
</header>

{# Avertissement visible : le tableau de bord est public et les adresses affichées
   appartiennent à un réseau réel. #}
<div class="avertissement" role="note">
  <strong>Données réelles, page publique.</strong>
  Cette page montre les adresses IP, les ports et les noms de domaines observés sur un
  réseau local. Aucun contenu de message n'est conservé — uniquement des métadonnées.
  Ne capturez que sur un réseau que vous administrez ou pour lequel vous disposez d'une
  autorisation écrite.
</div>

{# Barre de filtre d'affichage. Elle agit sur les trois listes à la fois — paquets,
   communications, détections — parce qu'un filtre qui ne s'appliquerait qu'à une partie
   de la page donnerait deux réponses différentes à la même question. #}
<nav class="vues" aria-label="Vues de l'analyse">
  <button type="button" class="vue-onglet" data-cible="traffic">Traffic</button>
  <button type="button" class="vue-onglet" data-cible="connections">Connections</button>
  <button type="button" class="vue-onglet" data-cible="protocols">Protocols</button>
  <button type="button" class="vue-onglet" data-cible="alerts">Alerts</button>
  <button type="button" class="vue-onglet" data-cible="paquets">Paquets</button>
</nav>

<section class="barre-filtre" aria-labelledby="titre-filtre">
  <h2 id="titre-filtre" class="sr-only">Filtre d'affichage</h2>
  <div class="barre-filtre__ligne">
    <label class="sr-only" for="champ-filtre">Expression de filtre</label>
    <input type="search" id="champ-filtre" class="champ-filtre" autocomplete="off"
           spellcheck="false"
           placeholder="proto:tcp port:443 ip:192.168.1."
           aria-describedby="aide-filtre filtre-erreur">
    <button type="button" class="bouton bouton--fantome" id="effacer-filtre">Effacer</button>
    <label class="sr-only" for="choix-profil">Profil d'analyse</label>
    <select id="choix-profil" class="choix-profil">
      <option value="">Profils…</option>
    </select>
  </div>
  <p class="aide" id="aide-filtre">
    Un filtre s'écrit <code>champ:valeur</code> ; plusieurs critères se cumulent.
    Champs disponibles : <code>proto</code> <code>port</code> <code>ip</code>
    <code>etat</code> <code>niveau</code> <code>taille</code> <code>texte</code>
    <code>session</code>. Exemple : <code>proto:tcp port:443</code>.
    Pour une valeur contenant une espace : <code>etat:"échec probable"</code>.
  </p>
  <p class="filtre-erreur" id="filtre-erreur" role="alert" hidden></p>
  <p class="filtre-resume" id="filtre-resume" hidden></p>

  {# Export : de simples liens de téléchargement, sans JavaScript. Le filtre courant
     leur est ajouté par le script, pour qu'on exporte exactement ce qu'on voit. #}
  <div class="exports">
    <span class="exports__intitule">Exporter ce qui est affiché :</span>
    <a class="bouton bouton--fantome" id="export-communications-csv"
       href="/api/v1/export?quoi=communications&amp;format=csv" download>Communications · CSV</a>
    <a class="bouton bouton--fantome" id="export-communications-json"
       href="/api/v1/export?quoi=communications&amp;format=json" download>Communications · JSON</a>
    <a class="bouton bouton--fantome" id="export-paquets-csv"
       href="/api/v1/export?quoi=paquets&amp;format=csv" download>Paquets · CSV</a>
    <a class="bouton bouton--fantome" id="export-detections-json"
       href="/api/v1/export?quoi=detections&amp;format=json" download>Détections · JSON</a>
  </div>
  </section>

{# Légende des couleurs. Elle réutilise les classes des pastilles réellement affichées :
   si une couleur change dans la feuille de style, la légende change avec elle. Une
   légende recopiée à la main finirait par mentir. #}
<details class="legende">
  <summary>Légende des couleurs et des niveaux</summary>
  <div class="legende__grille">
    <div class="legende__bloc">
      <h3>Protocoles</h3>
      <ul class="legende__liste">
        <li><span class="pastille-protocole" data-protocole="TCP">TCP</span> transport fiable, avec connexion</li>
        <li><span class="pastille-protocole" data-protocole="UDP">UDP</span> transport rapide, sans connexion</li>
        <li><span class="pastille-protocole" data-protocole="DNS">DNS</span> résolution de noms de domaine</li>
        <li><span class="pastille-protocole" data-protocole="ICMP">ICMP</span> messages de contrôle du réseau</li>
        <li><span class="pastille-protocole" data-protocole="inconnu">inconnu</span> protocole non identifié</li>
      </ul>
    </div>
    <div class="legende__bloc">
      <h3>État d'une communication</h3>
      <ul class="legende__liste">
        <li><span class="pastille-etat" data-etat="établie" data-certain="oui">établie</span> ouverture complète observée</li>
        <li><span class="pastille-etat" data-etat="en cours" data-certain="oui">en cours</span> des données circulent</li>
        <li><span class="pastille-etat" data-etat="fermée" data-certain="oui">fermée</span> conversation terminée</li>
        <li><span class="pastille-etat" data-etat="tentative" data-certain="non">tentative</span> <strong>déduit</strong> : le point d'interrogation signale une observation incomplète</li>
        <li><span class="pastille-etat" data-etat="échec probable" data-certain="oui">échec probable</span> aucune réponse à la demande</li>
      </ul>
      <p class="legende__note">
        Un état en <strong>pointillés</strong> est une déduction, pas un fait : la capture
        n'a pas vu le début de la conversation.
      </p>
    </div>
    <div class="legende__bloc">
      <h3>Niveaux d'une détection</h3>
      <ul class="legende__liste">
        <li><span class="etiquette-niveau" data-niveau="observation">observation</span> un fait mesuré, dont on ne conclut rien</li>
        <li><span class="etiquette-niveau" data-niveau="hypothèse">hypothèse</span> une forme qui ressemble à quelque chose, et que des usages ordinaires produisent aussi</li>
        <li><span class="etiquette-niveau" data-niveau="alerte">alerte</span> plusieurs indices de familles différentes convergent sur une même machine</li>
      </ul>
    </div>
  </div>
</details>

<main>
  <section data-vue-toujours="1" aria-labelledby="titre-capture" class="section-capture">
    <div class="titre-section--ligne">
      <h2 id="titre-capture" class="titre-section">Capture en direct</h2>
    </div>

    <div class="barre-capture">
      <label class="sr-only" for="choix-interface">Interface à écouter</label>
      <select id="choix-interface" class="choix-interface">
        <option value="">Chargement des interfaces…</option>
      </select>

      <label class="sr-only" for="filtre-capture">Filtre de capture</label>
      <input id="filtre-capture" type="text" class="champ-filtre" autocomplete="off"
             spellcheck="false" placeholder="Filtre de capture (facultatif) : tcp port 443">

      <button type="button" class="bouton bouton--principal" id="capture-demarrer">Démarrer</button>
      <button type="button" class="bouton bouton--fantome" id="capture-pause" aria-pressed="false"
              disabled>Pause</button>
      <button type="button" class="bouton bouton--danger" id="capture-arreter" disabled>Arrêter</button>
    </div>

    <p class="aide" id="capture-etat" role="status">Capture arrêtée.</p>
    <p class="filtre-erreur" id="capture-erreur" role="alert" hidden></p>

    <p class="aide">
      Le filtre de capture est <strong>différent</strong> du filtre d'affichage, et plus
      sévère : ce qu'il exclut n'est <strong>jamais</strong> capturé, alors qu'un filtre
      d'affichage peut toujours être retiré après coup. Il s'écrit en syntaxe BPF —
      <code>tcp port 443</code>, <code>udp port 53</code> — et non <code>proto:tcp</code>.
    </p>

    <div class="tableau-enveloppe tableau-enveloppe--vivant">
      <table class="tableau" id="tableau-vivant">
        <caption class="sr-only">Paquets reçus en direct, du plus récent au plus ancien</caption>
        <thead>
          <tr>
            <th scope="col">Heure</th>
            <th scope="col">Source</th>
            <th scope="col">Destination</th>
            <th scope="col">Protocole</th>
            <th scope="col">Port</th>
            <th scope="col">Taille</th>
            <th scope="col">Détail</th>
          </tr>
        </thead>
        <tbody id="corps-vivant">
          <tr class="ligne-vide">
            <td colspan="7">Aucune capture en cours. Choisissez une interface, puis Démarrer.</td>
          </tr>
        </tbody>
      </table>
    </div>
    <p class="aide" id="vivant-compteur"></p>
  </section>

  <section data-vue="traffic" aria-labelledby="titre-traffic">
    <h2 id="titre-traffic" class="titre-section">Traffic</h2>
    <div class="cartes" id="cartes">
      {# Valeurs remplies par le JavaScript : une seule source de vérité. #}
      <article class="carte"><p class="carte__valeur" id="val-paquets">—</p><p class="carte__libelle">Packets received<span class="carte__aide">depuis le démarrage</span></p></article>
      <article class="carte"><p class="carte__valeur" id="val-conserves">—</p><p class="carte__libelle">Kept in buffer<span class="carte__aide">les plus récents</span></p></article>
      <article class="carte"><p class="carte__valeur" id="val-octets">—</p><p class="carte__libelle">Data volume<span class="carte__aide">métadonnées seules</span></p></article>
      <article class="carte"><p class="carte__valeur" id="val-sessions">—</p><p class="carte__libelle">Sessions<span class="carte__aide">captures reçues</span></p></article>
      <article class="carte"><p class="carte__valeur" id="val-partielles">—</p><p class="carte__libelle">Partial analyses<span class="carte__aide">paquets malformés</span></p></article>
    </div>
  </section>

  <div class="colonnes">
    <section data-vue="protocols" aria-labelledby="titre-protocoles">
      <h2 id="titre-protocoles" class="titre-section">Protocols</h2>
      <ul class="repartition" id="repartition"></ul>
    </section>

    <section data-vue="traffic" aria-labelledby="titre-sources">
      <h2 id="titre-sources" class="titre-section">Top sources</h2>
      <ul class="repartition" id="sources"></ul>
    </section>
  </div>

  <section data-vue="alerts" aria-labelledby="titre-detections">
    <div class="titre-section--ligne">
      <h2 id="titre-detections" class="titre-section">Alerts</h2>
      <div class="filtres">
        <label class="sr-only" for="filtre-niveau">Filtrer par niveau</label>
        <select id="filtre-niveau">
          <option value="">Tous les niveaux</option>
          <option value="alerte">Alerte</option>
          <option value="hypothèse">Hypothèse</option>
          <option value="observation">Observation</option>
        </select>
      </div>
    </div>
    <p class="aide">
      Les niveaux disent le <strong>degré de certitude</strong>, pas le degré de danger.
      Une <em>observation</em> est un fait mesuré dont on ne conclut rien. Une
      <em>hypothèse</em> est une forme qui ressemble à quelque chose, et que des usages
      ordinaires produisent aussi. Une <em>alerte</em> naît de plusieurs indices
      convergents sur une même machine — une seule règle n'en produit jamais.
      Chaque détection nomme ce qu'elle peut avoir de faux.
    </p>
    <div id="liste-detections" class="detections"></div>
    <p class="vide" id="detections-vide" hidden>
      Rien à signaler pour l'instant. Les détections apparaissent dès que l'agent en
      transmet — sur un réseau calme, il est normal qu'il n'y en ait aucune.
    </p>
  </section>

  <section data-vue="traffic" aria-labelledby="titre-statistiques">
    <div class="titre-section--ligne">
      <h2 id="titre-statistiques" class="titre-section">Répartitions et débit</h2>
    </div>

    <div class="grille-statistiques">
      <article class="bloc-statistique">
        <h3 class="couches-titre">Protocoles</h3>
        <p class="aide">
          Le pourcentage porte toujours sur le nombre de paquets examinés : « 62 % de TCP »
          ne veut rien dire si l'on ignore ce que font les 38 % restants.
        </p>
        <div id="stats-hierarchie"></div>
      </article>

      <article class="bloc-statistique">
        <h3 class="couches-titre">Machines les plus actives</h3>
        <p class="aide">
          Émis et reçus sont distingués : un serveur qui répond beaucoup et une machine qui
          interroge beaucoup n'ont pas le même profil.
        </p>
        <div id="stats-extremites"></div>
      </article>

      <article class="bloc-statistique">
        <h3 class="couches-titre">Débit dans le temps</h3>
        <p class="aide">
          Les intervalles partent du premier paquet vu, jamais de l'horloge de la machine :
          un fichier rejoué produit le même graphique que la capture d'origine.
        </p>
        <div id="stats-debit" class="debit"></div>
      </article>
    </div>
  </section>

  <section data-vue="alerts" aria-labelledby="titre-anomalies">
    <div class="titre-section--ligne">
      <h2 id="titre-anomalies" class="titre-section">Expert Info</h2>
      <p class="aide" id="anomalies-resume"></p>
    </div>
    <p class="aide">
      Une anomalie est un <strong>fait mesuré</strong>, jamais une conclusion : une
      retransmission signale presque toujours un réseau lent, pas une attaque. Les critères
      qui l'ont déclenchée sont écrits avec elle, pour que vous puissiez la vérifier
      vous-même. Aucune anomalie, seule, ne produit une alerte.
    </p>
    <div id="anomalies-liste"></div>
  </section>

  <section data-vue="connections" aria-labelledby="titre-communications">
    <div class="titre-section--ligne">
      <h2 id="titre-communications" class="titre-section">Connections</h2>
      <div class="filtres">
        <label class="sr-only" for="filtre-etat">Filtrer par état</label>
        <select id="filtre-etat">
          <option value="">Tous les états</option>
          <option value="établie">Établie</option>
          <option value="en cours">En cours</option>
          <option value="tentative">Tentative</option>
          <option value="fermée">Fermée</option>
          <option value="échec probable">Échec probable</option>
          <option value="inconnue">Inconnue</option>
        </select>
      </div>
    </div>
    <p class="aide">
      Une communication regroupe tous les paquets échangés entre deux machines, dans les
      deux sens. L'état est déduit des indicateurs observés ; quand la capture a commencé
      après le début de la conversation, il est marqué <em>incertain</em> — c'est une
      déduction, pas un fait établi.
    </p>
    <div class="tableau-enveloppe">
      <table class="tableau" id="tableau-communications">
        <caption class="sr-only">Communications observées, la plus récente d'abord</caption>
        <thead>
          <tr>
            <th scope="col">État</th>
            <th scope="col">Protocole</th>
            <th scope="col">Extrémité A</th>
            <th scope="col">Extrémité B</th>
            <th scope="col">Paquets ↔</th>
            <th scope="col">Octets ↔</th>
            <th scope="col">Durée</th>
            <th scope="col">Ce que l'on peut en dire</th>
            <th scope="col"><span class="sr-only">Détail de l'explication</span></th>
          </tr>
        </thead>
        <tbody id="corps-communications"></tbody>
      </table>
    </div>
    <p class="vide" id="communications-vide" hidden>
      Aucune communication pour l'instant. Elles apparaissent dès que l'agent transmet.
    </p>

    {# Le détail sépare volontairement les faits observés de l'interprétation. C'est
       l'exigence du sujet, et elle est juste : sans cette séparation, un lecteur ne peut
       pas savoir ce qui a été mesuré et ce qui a été déduit. #}
    <div class="detail" id="detail-communication" hidden>
      <div class="detail-entete">
        <h3 id="detail-titre">Détail de la communication</h3>
        <button type="button" class="bouton bouton-discret" id="detail-fermer">
          Fermer
        </button>
      </div>
      <p class="detail-resume mono-cellule" id="detail-resume"></p>
      <div id="detail-explications"></div>
    </div>
  </section>

  {# Détail d'un paquet : les couches avec leur rôle, puis les octets reconstruits.

     Trois zones, visibles ensemble et nommées comme dans les outils de référence : la liste
     des paquets, le détail du paquet sélectionné, le contenu du paquet. Les empiler dans une
     fenêtre qu'il faut ouvrir obligerait à retenir ce qu'on vient de quitter. #}
  <div class="paquet-detail" id="paquet-detail" data-vue="paquets" aria-labelledby="paquet-detail-titre">
    <div class="detail-entete">
      <h3 id="paquet-detail-titre">Détail du paquet sélectionné</h3>
      <button type="button" class="bouton bouton--fantome" id="paquet-detail-fermer">
        Vider la sélection
      </button>
    </div>

    <p class="detail-vide" id="paquet-detail-vide">
      Cliquez un paquet dans la liste ci-dessus : ses couches et ses octets s'afficheront ici.
      Dans la liste, la colonne « Détail » et le bouton « Couches » mènent au même endroit.
    </p>

    <div id="paquet-detail-contenu">
      <p class="aide" id="paquet-detail-resume"></p>

      <h4 class="couches-titre">Les couches, de la plus basse à la plus haute</h4>
      <div id="paquet-couches"></div>

      <h4 class="couches-titre">Contenu du paquet — octets des en-têtes</h4>
      <p class="aide" id="paquet-hex-avertissement"></p>
      <pre class="hex" id="paquet-hex"></pre>
    </div>
  </div>

  <div class="paquet-detail" id="recit-detail" hidden aria-labelledby="recit-titre">
    <div class="detail-entete">
      <h3 id="recit-titre">Récit de la conversation</h3>
      <button type="button" class="bouton bouton--fantome" id="recit-fermer">Fermer</button>
    </div>
    <p class="aide" id="recit-resume"></p>

    <h4 class="couches-titre">Chronologie</h4>
    <p class="aide">
      Seuls les événements sont retenus — ouverture, acceptation, fermeture, rupture.
      Quarante échanges de données ne racontent rien de plus que le premier.
    </p>
    <div id="recit-moments"></div>

    <h4 class="couches-titre">Ce qui s'est passé, en français</h4>
    <p class="aide">
      Un fait est ce qui a été mesuré. Une lecture est ce qui en a été déduit, avec le
      critère qui l'a déclenchée. Les deux ne sont jamais mélangés dans une même phrase.
    </p>
    <div id="recit-phrases"></div>
  </div>

  <section data-vue="paquets" aria-labelledby="titre-paquets">
    <div class="titre-section--ligne">
      <h2 id="titre-paquets" class="titre-section">Liste des paquets</h2>
      <div class="filtres">
        <label class="sr-only" for="filtre-protocole">Filtrer par protocole</label>
        <select id="filtre-protocole">
          <option value="">Tous les protocoles</option>
        </select>
        <label class="sr-only" for="filtre-recherche">Rechercher</label>
        <input id="filtre-recherche" type="search" placeholder="IP, domaine, port…"
               autocomplete="off">
        <button type="button" class="bouton bouton--fantome" id="bascule-pause"
                aria-pressed="false">Pause</button>
      </div>
    </div>

    <noscript>
      <p class="message message--attention">
        Cette page a besoin du JavaScript pour se rafraîchir. Sans lui, les chiffres et le
        tableau restent vides. L'API reste consultable directement :
        <code>/api/v1/packets</code>.
      </p>
    </noscript>

    <div class="tableau-enveloppe">
      <table class="tableau" id="tableau-paquets">
        <caption class="sr-only">Paquets capturés, du plus récent au plus ancien</caption>
        <thead>
          <tr>
            <th scope="col">Heure</th>
            <th scope="col">Protocole</th>
            <th scope="col">Source</th>
            <th scope="col">Destination</th>
            <th scope="col">Port</th>
            <th scope="col">Taille</th>
            <th scope="col">TTL</th>
            <th scope="col">Détail</th>
          </tr>
        </thead>
        <tbody id="corps-paquets"></tbody>
      </table>
    </div>
    <p class="vide" id="tableau-vide" hidden>
      Aucun paquet pour l'instant. Lancez l'agent :
      <code>python agent/main.py --interface "Wi-Fi" --backend … --jeton …</code>
    </p>
  </section>

  <section data-vue="traffic" aria-labelledby="titre-sessions">
    <h2 id="titre-sessions" class="titre-section">Sessions</h2>
    <p class="aide">Une session correspond à un lancement de l'agent. En phase actuelle,
       cette liste vit en mémoire et disparaît au redémarrage du backend.</p>
    <ul class="liste-sessions" id="liste-sessions"></ul>
  </section>
</main>

<footer class="pied">
  <p>Exercice de formation — analyse de trafic réseau. Les explications sont produites par
     un moteur de règles déterministe : les mêmes paquets donnent toujours les mêmes
     phrases. La détection et l'enrichissement arrivent dans les phases suivantes.</p>
</footer>

{# Mise en forme d'une détection, recopiée par le JavaScript. #}
<template id="gabarit-detection">
  <article class="detection">
    <header class="detection-entete">
      <span class="etiquette-niveau"></span>
      <h3 class="detection-titre"></h3>
      <span class="detection-cible mono-cellule"></span>
    </header>
    <div class="bloc bloc-faits">
      <span class="bloc-intitule">Ce qui a été observé</span>
      <ul class="detection-faits"></ul>
    </div>
    <div class="bloc bloc-interpretation">
      <span class="bloc-intitule">Ce qu'on peut en dire</span>
      <p class="detection-explication"></p>
    </div>
    <div class="bloc bloc-prudence">
      <span class="bloc-intitule">Ce que cela peut être d'autre — faux positifs possibles</span>
      <p class="detection-faux-positifs"></p>
    </div>
    <footer class="detection-pied">
      <span class="detection-confiance"></span>
      <span class="detection-occurrences"></span>
    </footer>
  </article>
</template>

{# Mise en forme d'une ligne de paquet, recopiée par le JavaScript. #}
<template id="gabarit-communication">
  <tr>
    <td>
      <span class="pastille-etat"></span>
    </td>
    <td><span class="pastille-protocole"></span></td>
    <td class="col-extremite-a mono-cellule"></td>
    <td class="col-extremite-b mono-cellule"></td>
    <td class="mono-cellule col-echanges"></td>
    <td class="mono-cellule col-volume"></td>
    <td class="mono-cellule col-duree"></td>
    <td class="col-note"></td>
    <td>
      <button type="button" class="bouton bouton-discret bouton-detail">
        Expliquer
      </button>
      <button type="button" class="bouton bouton-discret bouton-recit">
        Raconter
      </button>
    </td>
  </tr>
</template>

<template id="gabarit-ligne">
  <tr>
    <td class="col-heure"></td>
    <td><span class="pastille-protocole"></span></td>
    <td class="col-source"></td>
    <td class="col-destination"></td>
    <td class="col-port"></td>
    <td class="col-taille"></td>
    <td class="col-ttl"></td>
    <td class="col-detail">
      <span class="col-detail-texte"></span>
      <button type="button" class="bouton bouton--fantome bouton-couches">Couches</button>
    </td>
  </tr>
</template>

<script src="{{ url_for('static', path='/dashboard.js') }}" defer></script>
</body>
</html>
