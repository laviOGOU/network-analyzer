<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img"
     aria-label="FlowScope — un œil formé de deux arcs, contenant un signal">
  <title>FlowScope</title>
  <defs>
    <!-- Le dégradé principal, du cyan vers le bleu, du haut vers le bas : c'est lui qui donne
         à l'œil son relief. Le cyan tient le haut et les deux pointes, le bleu tient le bas. -->
    <linearGradient id="fs-oeil" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#2FE0F5"/>
      <stop offset="45%"  stop-color="#22A8F0"/>
      <stop offset="100%" stop-color="#1E5BF0"/>
    </linearGradient>

    <!-- L'iris : un peu plus bleu que l'œil, pour que les deux formes se distinguent là où
         elles se chevauchent. -->
    <linearGradient id="fs-iris" x1="0.2" y1="0" x2="0.8" y2="1">
      <stop offset="0%"   stop-color="#31C9F5"/>
      <stop offset="100%" stop-color="#1D63EA"/>
    </linearGradient>

    <!-- Les barres : cyan franc, pour ressortir sur l'iris. -->
    <linearGradient id="fs-barres" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#7DEBFF"/>
      <stop offset="100%" stop-color="#22A8F0"/>
    </linearGradient>

    <!-- La lueur : c'est elle qui donne au logo son aspect lumineux. Sans elle, le tracé
         paraît plat sur un fond sombre. -->
    <filter id="fs-lueur" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3.5" result="flou"/>
      <feMerge>
        <feMergeNode in="flou"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <g filter="url(#fs-lueur)">
    <!-- L'ŒIL. Un contour, pas une forme pleine : deux amandes superposées, dont l'écart
         dessine le trait. C'est ce qui fait que le trait **s'affine naturellement** jusqu'aux
         deux pointes — un trait d'épaisseur constante se terminerait en rond. -->
    <path fill="url(#fs-oeil)" fill-rule="evenodd"
          d="M2 100 C 44 52, 156 52, 198 100 C 156 148, 44 148, 2 100 Z
             M2 100 C 46 68, 154 68, 198 100 C 154 132, 46 132, 2 100 Z"/>

    <!-- L'IRIS : un anneau, nettement plus mince que le trait de l'œil. -->
    <circle cx="100" cy="100" r="46" fill="none" stroke="url(#fs-iris)" stroke-width="11"/>

    <!-- LE SIGNAL : cinq barres, la plus haute au centre. Elles montent puis redescendent —
         c'est un niveau, pas un histogramme. -->
    <g fill="url(#fs-barres)">
      <rect x="72"  y="80" width="14" height="26" rx="6"/>
      <rect x="88"  y="68" width="14" height="38" rx="6"/>
      <rect x="104" y="56" width="14" height="50" rx="6"/>
      <rect x="120" y="64" width="14" height="42" rx="6"/>
      <rect x="136" y="78" width="14" height="28" rx="6"/>
    </g>

    <!-- LE REFLET : un croissant clair en haut à droite de l'iris. C'est le détail qui fait
         qu'un œil regarde au lieu d'être un cercle. -->
    <path d="M124 70 A 34 34 0 0 1 138 88" fill="none" stroke="#EAFDFF"
          stroke-width="7" stroke-linecap="round" opacity="0.9"/>
  </g>
</svg>
