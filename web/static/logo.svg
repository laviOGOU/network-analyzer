<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img"
     aria-label="FlowScope — un œil qui observe un signal">
  <title>FlowScope</title>
  <defs>
    <!-- Le dégradé du logo : du bleu électrique au cyan. C'est lui qui donne à l'œil son
         relief, et il suit le thème plutôt que d'être figé dans une image. -->
    <linearGradient id="flowscope" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="55%" stop-color="#22A7F0"/>
      <stop offset="100%" stop-color="#22D3EE"/>
    </linearGradient>
  </defs>

  <!-- L'œil : deux arcs qui se rejoignent en pointe, haut et bas. -->
  <path d="M4 32 C 16 16, 48 16, 60 32 C 48 48, 16 48, 4 32 Z"
        fill="none" stroke="url(#flowscope)" stroke-width="3.2"
        stroke-linejoin="round"/>

  <!-- L'iris, ouvert : c'est la partie qui « regarde ». -->
  <circle cx="32" cy="32" r="12.5" fill="none" stroke="url(#flowscope)" stroke-width="3"/>

  <!-- Le signal, dans l'œil : quatre barres, comme un niveau qui monte. -->
  <g fill="url(#flowscope)">
    <rect x="24" y="33" width="2.6" height="6"  rx="1.1"/>
    <rect x="28.4" y="29" width="2.6" height="10" rx="1.1"/>
    <rect x="32.8" y="25.5" width="2.6" height="13.5" rx="1.1"/>
    <rect x="37.2" y="31" width="2.6" height="8"  rx="1.1"/>
  </g>
</svg>
